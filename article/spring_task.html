891131560,"last_edited_time":1721891131563,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"b2e014e6-3018-43bb-a1eb-d0ee6c38db84":{"value":{"id":"b2e014e6-3018-43bb-a1eb-d0ee6c38db84","type":"header","properties":{"title":[["背景"]]},"created_time":1721891133277,"last_edited_time":1721891178665,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"fd6313d8-d4ba-42de-bc0c-ba20ca88690b":{"value":{"id":"fd6313d8-d4ba-42de-bc0c-ba20ca88690b","type":"text","properties":{"title":[["在色彩斑斓的产品需求中，有存在一类需求，是需要去"],["定时执行",[["b"]]],["的，此时就需要使用到"],["定时任务",[["b"]]],["。例如说，每分钟扫描超时支付的订单，每小时清理一次日志文件，每天统计前一天的数据并生成报表，每个月月初的工资单的推送，每年一次的生日提醒等等。"]]},"created_time":1721891171124,"last_edited_time":1721891193131,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"7bc68f8e-2134-4e4b-a698-8a05bb292f20":{"value":{"id":"7bc68f8e-2134-4e4b-a698-8a05bb292f20","type":"text","properties":{"title":[["在 JDK 中，内置了两个类，可以实现定时任务的功能："]]},"created_time":1721891171125,"last_edited_time":1721891171147,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"d19e3f03-8977-440e-be09-6f56d29977c0":{"value":{"id":"d19e3f03-8977-440e-be09-6f56d29977c0","type":"bulleted_list","properties":{"title":[["java.util.Timer",[["c"]]],[" ：可以通过创建 "],["java.util.TimerTask",[["c"]]],[" 调度任务，在同一个线程中"],["串行",[["b"]]],["执行，相互影响。也就是说，对于同一个 Timer 里的多个 TimerTask 任务，如果一个 TimerTask 任务在执行中，其它 TimerTask 即使到达执行的时间，也只能排队等待。因为 Timer 是串行的，同时存在 "],["坑",[["a","https://blog.csdn.net/qincidong/article/details/82526458"]]],[" ，所以后来 JDK 又推出了 ScheduledExecutorService ，Timer 也基本不再使用。"]]},"created_time":1721891171126,"last_edited_time":1721891225212,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"9d477961-4914-40ce-97c1-f18d5cb926da":{"value":{"id":"9d477961-4914-40ce-97c1-f18d5cb926da","type":"bulleted_list","properties":{"title":[["java.util.concurrent.ScheduledExecutorService",[["c"]]],[" ：在 JDK 1.5 新增，基于线程池设计的定时任务类，每个调度任务都会被分配到线程池中"],["并发",[["b"]]],["执行，互不影响。这样，ScheduledExecutorService 就解决了 Timer 串行的问题。"]]},"created_time":1721891171127,"last_edited_time":1721891232261,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"d0b6bacd-0ad1-4d43-b842-bd1b3c36e721":{"value":{"id":"d0b6bacd-0ad1-4d43-b842-bd1b3c36e721","type":"text","properties":{"title":[["在日常开发中，我们很少直接使用 Timer 或 ScheduledExecutorService 来实现定时任务的需求。主要有几点原因："]]},"created_time":1721891171127,"last_edited_time":1721891171147,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"de11f9b3-c470-4e41-ba58-0f2eb942faf3":{"value":{"id":"de11f9b3-c470-4e41-ba58-0f2eb942faf3","type":"bulleted_list","properties":{"title":[["它们仅支持按照指定频率，不"],["直接",[["b"]]],["支持指定时间的定时调度，需要我们结合 Calendar 自行计算，才能实现复杂时间的调度。例如说，每天、每周五、2019-11-11 等等。"]]},"created_time":1721891171128,"last_edited_time":1721891171147,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"7720d75e-f854-4b92-a479-9e48ad89f03d":{"value":{"id":"7720d75e-f854-4b92-a479-9e48ad89f03d","type":"bulleted_list","properties":{"title":[["它们是进程级别，而我们为了实现定时任务的高可用，需要部署多个进程。此时需要等多考虑，多个进程下，同一个任务在相同时刻，不能重复执行。"]]},"created_time":1721891171128,"last_edited_time":1721891171147,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"12784d22-6fad-40ee-b7b5-28e0de647cf5":{"value":{"id":"12784d22-6fad-40ee-b7b5-28e0de647cf5","type":"bulleted_list","properties":{"title":[["项目可能存在定时任务较多，需要统一的管理，此时不得不进行二次封装。"]]},"created_time":1721891171129,"last_edited_time":1721891171147,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"0c08b58d-78e0-412e-b728-504c4753d16a":{"value":{"id":"0c08b58d-78e0-412e-b728-504c4753d16a","type":"text","properties":{"title":[["所以，一般情况下，我们会选择专业的"],["调度任务中间件",[["b"]]],["。"]]},"created_time":1721891171129,"last_edited_time":1721891171147,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"51c62c2f-9f4b-4bf4-a34b-9d637dc15e77":{"value":{"id":"51c62c2f-9f4b-4bf4-a34b-9d637dc15e77","type":"quote","properties":{"title":[["关于“任务”的叫法，也有叫“作业”的。在英文上，有 Task 也有 Job 。本质是一样的，本文两种都会用。"]]},"content":["0e8e0c63-35a1-4dfd-af17-243c7853c525"],"created_time":1721891171130,"last_edited_time":1721891171147,"parent_i "value":{"id":"495c8b7a-45c7-4013-bdb2-ea3d1ae565b6","type":"sub_header","properties":{"title":[["配置文件"]]},"created_time":1721893918126,"last_edited_time":1721893927638,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"e64e7e20-98ac-4087-abbd-f4bc506ae55b":{"value":{"id":"e64e7e20-98ac-4087-abbd-f4bc506ae55b","type":"code","properties":{"title":[["spring:\n  task:\n    # Spring Task 调度任务的配置，对应 TaskSchedulingProperties 配置类\n    scheduling:\n      thread-name-prefix: frank- # 线程池的线程名的前缀。默认为 scheduling- ，建议根据自己应用来设置\n      pool:\n        size: 10 # 线程池大小。默认为 1 ，根据自己应用来设置\n      shutdown:\n        await-termination: true # 应用关闭时，是否等待定时任务执行完成。默认为 false ，建议设置为 true\n        await-termination-period: 60 # 等待任务完成的最大时长，单位为秒。默认为 0 ，根据自己应用来设置"]],"language":[["YAML"]]},"created_time":1721893943573,"last_edited_time":1721893958866,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"ec8c4fac-6c9a-4e6a-bf6c-bd53793fbaec":{"value":{"id":"ec8c4fac-6c9a-4e6a-bf6c-bd53793fbaec","type":"bulleted_list","properties":{"title":[["Spring Boot "],["TaskSchedulingAutoConfiguration",[["a","https://github.com/spring-projects/spring-boot/blob/master/spring-boot-project/spring-boot-autoconfigure/src/main/java/org/springframework/boot/autoconfigure/task/TaskSchedulingAutoConfiguration.java"]]],[" 自动化配置类，实现 Spring Task 的自动配置，创建 "],["ThreadPoolTaskScheduler",[["a","https://github.com/spring-projects/spring-framework/blob/master/spring-context/src/main/java/org/springframework/scheduling/concurrent/ThreadPoolTaskScheduler.java"]]],[" 基于线程池的任务调度器。本质上，ThreadPoolTaskScheduler 是基于 ScheduledExecutorService 的封装，增强在调度时间上的功能。"]]},"created_time":1721894102523,"last_edited_time":1721894102536,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"a2d6431b-5663-4435-8877-8f301550e1eb":{"value":{"id":"a2d6431b-5663-4435-8877-8f301550e1eb","type":"text","properties":{"title":[["注意",[["b"]]],["，"],["spring.task.scheduling.shutdown",[["c"]]],[" 配置项，是为了实现 Spring Task 定时任务的优雅关闭。我们想象一下，如果定时任务在执行的过程中，如果应用开始关闭，把定时任务需要使用到的 Spring Bean 进行销毁，例如说数据库连接池，那么此时定时任务还在执行中，一旦需要访问数据库，可能会导致报错。"]]},"created_time":1721894102523,"last_edited_time":1721894102536,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"1f2a3e60-f74d-4b9f-b872-efc2fb36c19e":{"value":{"id":"1f2a3e60-f74d-4b9f-b872-efc2fb36c19e","type":"bulleted_list","properties":{"title":[["所以，通过配置 "],["await-termination = true",[["c"]]],[" ，实现应用关闭时，等待定时任务执行完成。这样，应用在关闭的时，Spring 会优先等待 ThreadPoolTaskScheduler 执行完任务之后，再开始 Spring Bean 的销毁。"]]},"created_time":1721894102524,"last_edited_time":1721894102536,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"efbdc7f1-49dc-4229-8a1f-2af31cb81b93":{"value":{"id":"efbdc7f1-49dc-4229-8a1f-2af31cb81b93","type":"bulleted_list","properties":{"title":[["同时，又考虑到我们不可能无限等待定时任务全部执行结束，因此可以配置 "],["await-termination-period = 60",[["c"]]],[" ，等待任务完成的最大时长，单位为秒。具体设置多少的等待时长，可以根据自己应用的需要。"]]},"created_time":1721894102525,"last_edited_time":1721894102536,"parent_id":"640d8f9f-47df-49b4-9bbd-52c01e76b8c0"}},"4e2383c5-c1b7-4dec-9602-fb11334db443":{"value":{"id":"4e2383c5-c1b7-4dec-9602-fb11334db443","type":"bulleted_list","properties":{"title":[["cron",[["c"]]],[" 属性：Spring Cron 表达式。例如说，"],["\"0 0 12 * * ?\"",[["c"]]],[" 表示每天中午执行一次，"],["\"11 11 11 11 11 ?\"",[["c"]]],[" 表示 11 月 11 号 11 点 11 分 11 秒执行一次。更多示例和讲解，可以看看 "],["Spring Cron 表达式",[["a","https://youngff.github.io/MyHearthStone/spring%20framework/spring-util/spring-cron/"]]],["，也可以使用"],["Quartz/Cron/Crontab 表达式在线生成工具",[["a","http://www.bejson.com/othertools/cron/"]]],[" 。注意，以调用"],["完成时刻",[["b"]]],["为开始计时时间。"]]},"created_time":1721893153351,"last_edited_time":1721896396088,"parent_id":"f841d713-5a4e-4339-8ab0-287557d0616d"}},"c421b31f-33f3-4c4d-9c79-a889d7ac54a4":{"value":{"id":"c421b31f-33f3-4c4d-9c79-a889d7ac54a4","type":"bulleted_list","properties":{"title":[["fixedDelay",[["c"]]],[" 属性：固定执行间隔，单位：毫秒（ms）。注意，以调用"],["完成时刻",[["b"]]],["为开始计时时间。也就是说，从上一个方法执行完成开始算起，"],["如果上一次方法执行阻塞住了，那么直到上一次执行完，并间隔给定的时间后，才执行下一次（即每次执行都会间隔一段时间）",[["b"],["h","orange"]]],["。"]]},"created_time":1721893153351,"last_edited_time":1721893880086,"parent_id":"f841d713-5a4e-4339-8ab0-287557d0616d"}},"01e1a8b9-a15d-4c30-b1b8-7a69869fb29a":{"value":{"id":"01e1a8b9-a15d-4c30-b1b8-7a69869fb29a","type":"bulleted_list","properties":{"title":[["fixedRate",[["c"]]],[" 属性：固定执行间隔，单位：毫秒（ms）。注意，以调用"],["开始时刻",[["b"]]],["为开始计时时间。也就是说，"],["从上一次方法执行开始的时间算起，如果上一次方法阻塞住了，下一次也是不会执行，但是在阻塞这段时间内累计应该执行的次数，当不再阻塞时，一下子把这些全部执行掉，而后再按照固定速率继续执行（即不会让下次执行一定要在上一次执行完之后间隔一段时间才执行）。",[["b"],["h","orange"]]]]},"created_time":1721893153352,"last_edited_time":1721893899498,"parent_id":"f841d713-5a4e-4339-8ab0-287557d0616d"}},"f5564f92-acb0-4ffb-8e5a-6348ac054847":{"value":{"id":"f5564f92-acb0-4ffb-8e5a-6348ac054847","type":"bulleted_list","properties":{"title":[["这三个属性，有点雷同，可以看看 "],["《@Scheduled 定时任务的fixedRate、fixedDelay、cron 的区别》",[["a","https://www.iteye.com/blog/guwq2014-2424520"]]],[" ，一定要分清楚差异。"]]},"created_time":1721893153352,"last_edited_time":1721893169108,"parent_id":"f841d713-5a4e-4339-8ab0-287557d0616d"}},"94c8abe8-214b-478d-8150-0cca2b91c0ed":{"value":{"id":"94c8abe8-214b-478d-8150-0cca2b91c0ed","type":"bulleted_list","properties":{"title":[["initialDelay",[["c"]]],[" 属性：初始化的定时任务执行延迟，单位：毫秒（ms）。"]]},"created_time":1721893161596,"last_edited_time":1721893908666,"parent_id":"0c889465-baf1-4933-95d7-8f764370fb80"}},"c0321cda-b743-41cd-a322-37a16d89f9ba":{"value":{"id":"c0321cda-b743-41cd-a322-37a16d89f9ba","type":"bulleted_list","properties":{"title":[["zone",[["c"]]],[" 属性：解析 Spring Cron 表达式的所属的时区。默认情况下，使用服务器的本地时区。"]]},"created_time":1721893161596,"last_edited_time":1721893171008,"parent_id":"0c889465-baf1-4933-95d7-8f764370fb80"}},"dd6a88ea-3ab7-483b-8def-ed19186a01be":{"value":{"id":"dd6a88ea-3ab7-483b-8def-ed19186a01be","type":"bulleted_list","properties":{"title":[["initialDelayString",[["c"]]],[" 属性："],["initialDelay",[["c"]]],[" 的字符串形式。"]]},"created_time":1721893161597,"last_edited_time":1721893171008,"parent_id":"0c889465-baf1-4933-95d7-8f764370fb80"}},"dfa1e210-3904-4566-8
