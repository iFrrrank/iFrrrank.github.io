name: Deploy NotionNext to GitHub Pages

on:
  push:
    branches:
      - master
      - refactor-blog
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动从 Notion 拉取更新并重新发布

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 🚀 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: 📦 Install Dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: 🔧 Build and Export Static Site
        run: |
          yarn export
          touch out/.nojekyll
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
