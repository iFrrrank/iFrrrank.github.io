name: Setup NotionNext Codebase

on:
  workflow_dispatch:
  push:
    branches:
      - refactor-blog
    paths:
      - '.github/workflows/setup-notionnext.yml'
      - '.github/scripts/setup.sh'

jobs:
  init:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Checkout Current Repo
        uses: actions/checkout@v4
        with:
          ref: refactor-blog
          fetch-depth: 0

      - name: 📥 Run Setup Script
        run: bash .github/scripts/setup.sh
